
name: Build MANISHA Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MANISHA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            DIR="."
          else
            FILE=$(find . -maxdepth 4 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path "*/.gradle/*" | head -n 1)

            if [ -z "$FILE" ]; then
              echo "ERROR: Android settings.gradle not found."
              exit 1
            fi

            DIR=$(dirname "$FILE")
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          find . -type f -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK generated: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANISHA-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
